<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portada Instagram · Motos Fernández</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --violeta-profundo: #3D2649;
    --violeta-medio: #6B4F7A;
    --violeta-vibrante: #9B59B6;
    --lila: #C39BD3;
    --fondo: #0A0810;
    --blanco: #ffffff;
    --whatsapp: #25D366;
    --naranja: #FF9500;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--fondo);
    overflow: hidden;
    font-family: "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Lienzo exacto 1080x1350 */
  #portada {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: var(--fondo);
    overflow: hidden;
    color: var(--blanco);
  }

  /* Modo "ajustar para ver en pantalla" (se desactiva con ?fit=0 al capturar) */
  body.fit #portada {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(var(--escala, 1));
    transform-origin: center center;
  }

  /* Foto de fondo full-bleed */
  #foto {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  #foto.placeholder {
    background: radial-gradient(120% 90% at 50% 12%, #2a1b33 0%, #150e1d 55%, var(--fondo) 100%);
  }

  /* Scrim: oscurece arriba y abajo para legibilidad */
  #scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(10,8,16,.78) 0%, rgba(10,8,16,.30) 20%, rgba(10,8,16,0) 38%),
      linear-gradient(0deg, rgba(10,8,16,.95) 0%, rgba(10,8,16,.85) 22%, rgba(10,8,16,.35) 48%, rgba(10,8,16,0) 66%);
  }

  /* ===== HEADER ===== */
  #header {
    position: absolute;
    top: 56px;
    left: 64px;
    right: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 3;
  }
  .marca-wrap { display: flex; align-items: center; gap: 20px; }
  .mf-mono { width: 76px; height: 76px; display: block; filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); }
  .marca-txt {
    font-family: "Inter", sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--blanco);
    line-height: 1;
  }
  .marca-txt span { color: var(--lila); }

  .badge {
    font-family: "Inter", sans-serif;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: .10em;
    text-transform: uppercase;
    color: #fff;
    padding: 14px 26px;
    border-radius: 999px;
    box-shadow: 0 8px 22px rgba(0,0,0,.35);
  }
  .badge.cero { background: var(--naranja); color: #1a0f00; }
  .badge.usada { background: linear-gradient(135deg, var(--violeta-vibrante), var(--violeta-medio)); }

  /* ===== BLOQUE INFERIOR ===== */
  #info {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 132px;
    z-index: 3;
  }
  #kicker {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--lila);
    margin-bottom: 14px;
  }
  #modelo {
    font-family: "Sora", sans-serif;
    font-weight: 800;
    font-size: 96px;
    line-height: .96;
    letter-spacing: -.035em;
    color: var(--blanco);
    text-shadow: 0 8px 30px rgba(0,0,0,.45);
    margin-bottom: 30px;
  }

  /* Specs */
  #specs {
    display: flex;
    gap: 56px;
    flex-wrap: wrap;
    margin-bottom: 34px;
  }
  .spec { display: flex; flex-direction: column; gap: 6px; }
  .spec .lbl {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--lila);
  }
  .spec .val {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 38px;
    color: var(--blanco);
    line-height: 1;
  }

  /* Precio + WhatsApp */
  #precio-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 28px;
  }
  #precio-box { display: flex; flex-direction: column; gap: 8px; }
  #precio {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 84px;
    line-height: .92;
    color: var(--blanco);
    letter-spacing: -.01em;
  }
  #cuotas {
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 25px;
    color: var(--lila);
  }
  #wpp {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: var(--whatsapp);
    color: #053d1c;
    font-family: "Inter", sans-serif;
    font-weight: 800;
    font-size: 27px;
    padding: 20px 32px;
    border-radius: 999px;
    box-shadow: 0 12px 30px rgba(37,211,102,.35);
    white-space: nowrap;
  }
  #wpp svg { width: 34px; height: 34px; display: block; }

  /* ===== FOOTER ===== */
  #footer {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 3;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 500;
    font-size: 24px;
    letter-spacing: .04em;
    color: rgba(255,255,255,.62);
  }
  #footer .sep { display: none; }
</style>
</head>
<body>
  <div id="portada">
    <div id="foto"></div>
    <div id="scrim"></div>

    <div id="header">
      <div class="marca-wrap">
        <!-- Monograma MF -->
        <svg class="mf-mono" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <mask id="mfmask">
              <rect width="1024" height="1024" fill="white" />
              <g transform="translate(0,1024) scale(0.1,-0.1)" fill="black">
                <path d="M0 5120 l0 -5120 5120 0 5120 0 0 5120 0 5120 -5120 0 -5120 0 0 -5120z m2992 1235 c266 -264 619 -615 785 -779 l302 -299 468 464 c257 255 610 604 783 776 174 172 319 313 323 313 4 0 7 -282 7 -627 l-1 -628 -352 -345 -352 -345 -3 155 -3 154 -434 -434 -434 -434 -298 295 c-164 162 -359 354 -433 426 l-135 132 -5 -872 -5 -872 -355 0 -355 0 0 1702 c0 937 3 1702 7 1700 4 -1 225 -218 490 -482z m4758 456 c0 -5 -54 -146 -120 -313 -67 -167 -127 -319 -134 -338 l-14 -35 -836 -3 -836 -2 0 343 c0 189 3 347 7 350 10 11 1933 8 1933 -2z m-509 -1388 c-10 -27 -54 -138 -97 -248 -42 -110 -94 -243 -115 -295 l-37 -95 -588 0 -589 0 -3 343 -2 342 725 0 725 0 -19 -47z m-1581 -1028 l0 -965 -355 0 -355 0 0 622 0 623 98 93 c53 52 210 206 348 343 138 137 254 249 257 249 4 0 7 -434 7 -965z" />
              </g>
            </mask>
          </defs>
          <rect width="1024" height="1024" rx="120" fill="#3D2649" mask="url(#mfmask)" />
        </svg>
        <div class="marca-txt">MOTOS<br />·&nbsp;<span>FERNÁNDEZ</span></div>
      </div>
      <div id="badge" class="badge usada">USADA</div>
    </div>

    <div id="info">
      <div id="kicker">Usada · Oportunidad</div>
      <h1 id="modelo">Honda XR 150L</h1>
      <div id="specs"></div>
      <div id="precio-row">
        <div id="precio-box">
          <div id="precio">$1.890.000</div>
          <div id="cuotas"></div>
        </div>
        <div id="wpp">
          <svg viewBox="0 0 32 32" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.04 3.2c-7.06 0-12.8 5.74-12.8 12.8 0 2.26.6 4.46 1.72 6.4L3.2 28.8l6.56-1.72c1.87 1.02 3.97 1.56 6.28 1.56 7.06 0 12.8-5.74 12.8-12.8s-5.74-12.8-12.8-12.8zm0 23.36c-2.05 0-4.06-.55-5.81-1.59l-.42-.25-3.89 1.02 1.04-3.79-.27-.44a10.5 10.5 0 0 1-1.61-5.6c0-5.86 4.77-10.62 10.63-10.62 2.84 0 5.5 1.11 7.51 3.12a10.55 10.55 0 0 1 3.11 7.52c0 5.86-4.77 10.63-10.62 10.63zm5.83-7.96c-.32-.16-1.89-.93-2.18-1.04-.29-.11-.5-.16-.71.16-.21.32-.82 1.04-1 1.25-.18.21-.37.24-.69.08-.32-.16-1.35-.5-2.57-1.59-.95-.85-1.59-1.89-1.78-2.21-.18-.32-.02-.49.14-.65.14-.14.32-.37.48-.55.16-.18.21-.32.32-.53.11-.21.05-.4-.03-.55-.08-.16-.71-1.72-.98-2.35-.26-.62-.52-.54-.71-.55h-.61c-.21 0-.55.08-.84.4-.29.32-1.1 1.08-1.1 2.62 0 1.54 1.13 3.03 1.29 3.24.16.21 2.22 3.39 5.38 4.76.75.32 1.34.51 1.8.66.76.24 1.44.21 1.99.13.61-.09 1.89-.77 2.16-1.52.27-.74.27-1.38.19-1.52-.08-.13-.29-.21-.61-.37z" />
          </svg>
          Consultanos
        </div>
      </div>
    </div>

    <div id="footer">
      <div id="web">motosfernandez.com.ar</div>
      <div id="tel">291 578-8671</div>
    </div>
  </div>

<script>
  (function () {
    var qs = new URLSearchParams(location.search);
    function g(k, d) { var v = qs.get(k); return (v === null || v === "") ? (d === undefined ? "" : d) : v; }

    // ---- Datos (con defaults demo si se abre sin params) ----
    var foto = g("foto", "");
    var marca = g("marca", "Honda");
    var modelo = g("modelo", "XR 150L");
    var anio = g("anio", "2022");
    var km = g("km", "8420");
    var cil = g("cil", "149 cc");
    var precio = g("precio", "1890000");
    var cuotas = g("cuotas", "");
    var condicion = (g("condicion", "usada") || "").toLowerCase();
    var tel = g("tel", "291 578-8671");
    var web = g("web", "motosfernandez.com.ar");

    // ---- Helpers de formato (es-AR) ----
    function fmtMiles(n) {
      var num = parseInt(String(n).replace(/[^\d]/g, ""), 10);
      if (!isFinite(num)) return null;
      return new Intl.NumberFormat("es-AR").format(num);
    }
    function fmtKm(v) {
      if (v === "" || v === null) return null;
      var n = fmtMiles(v);
      return n === null ? null : n + " km";
    }
    function fmtPrecio(v) {
      if (v === "" || v === null) return "Consultar";
      var n = fmtMiles(v);
      return n === null ? "Consultar" : "$" + n;
    }

    // ---- Condición: badge + kicker ----
    var es0km = condicion === "0km" || condicion === "0 km" || condicion === "0";
    var badge = document.getElementById("badge");
    var kicker = document.getElementById("kicker");
    if (es0km) {
      badge.className = "badge cero";
      badge.textContent = "0 KM";
      kicker.textContent = "0 KM · Unidad nueva";
    } else {
      badge.className = "badge usada";
      badge.textContent = "USADA";
      kicker.textContent = "Usada · Oportunidad";
    }

    // ---- Foto de fondo ----
    var fotoEl = document.getElementById("foto");

    // ---- Modelo (marca + modelo) ----
    var modeloTxt = ((marca ? marca + " " : "") + modelo).trim();
    var modeloEl = document.getElementById("modelo");
    modeloEl.textContent = modeloTxt || modelo || "";

    // ---- Specs (ocultar vacíos) ----
    var specsEl = document.getElementById("specs");
    var specs = [];
    if (anio) specs.push({ lbl: "Año", val: anio });
    var kmTxt = (km === "" ) ? null : (String(km).trim() === "0" ? "0 km" : fmtKm(km));
    if (kmTxt) specs.push({ lbl: "Kilómetros", val: kmTxt });
    if (cil) specs.push({ lbl: "Cilindrada", val: cil });
    specsEl.innerHTML = specs.map(function (s) {
      return '<div class="spec"><div class="lbl">' + s.lbl + '</div><div class="val">' + s.val + '</div></div>';
    }).join("");

    // ---- Precio + cuotas ----
    document.getElementById("precio").textContent = fmtPrecio(precio);
    var cuotasEl = document.getElementById("cuotas");
    if (cuotas) { cuotasEl.textContent = cuotas; } else { cuotasEl.style.display = "none"; }

    // ---- Footer ----
    document.getElementById("web").textContent = web || "";
    document.getElementById("tel").textContent = tel || "";
    if (!web) document.getElementById("web").style.display = "none";
    if (!tel) document.getElementById("tel").style.display = "none";

    // ---- Auto-ajuste del tamaño del modelo si es largo ----
    function ajustarModelo() {
      var maxW = 1080 - 128; // 64px de margen a cada lado
      var sizes = [96, 88, 80, 76, 68, 62, 56];
      for (var i = 0; i < sizes.length; i++) {
        modeloEl.style.fontSize = sizes[i] + "px";
        if (modeloEl.scrollWidth <= maxW && modeloEl.offsetHeight <= 240) break;
      }
    }

    // ---- Escalado para vista humana (no afecta la captura con ?fit=0) ----
    var fit = g("fit", "1") !== "0";
    function escalar() {
      if (!fit) { document.body.classList.remove("fit"); return; }
      document.body.classList.add("fit");
      var s = Math.min(window.innerWidth / 1080, window.innerHeight / 1350);
      document.documentElement.style.setProperty("--escala", s > 0 ? s : 1);
    }
    window.addEventListener("resize", escalar);

    // ---- Marcar listo (tras fuentes + imagen de fondo) ----
    function listo() {
      window.__PORTADA_READY__ = true;
      document.documentElement.setAttribute("data-portada-ready", "1");
    }
    function cargarFotoYListo() {
      ajustarModelo();
      escalar();
      if (foto) {
        var img = new Image();
        img.onload = function () {
          fotoEl.style.backgroundImage = 'url("' + foto.replace(/"/g, '%22') + '")';
          listo();
        };
        img.onerror = function () {
          fotoEl.classList.add("placeholder");
          listo();
        };
        img.src = foto;
      } else {
        fotoEl.classList.add("placeholder");
        listo();
      }
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { cargarFotoYListo(); });
      // Fallback por si las fuentes tardan
      setTimeout(function () { if (!window.__PORTADA_READY__) cargarFotoYListo(); }, 2500);
    } else {
      cargarFotoYListo();
    }
  })();
</script>
</body>
</html>
